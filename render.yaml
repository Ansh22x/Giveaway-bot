services:
  - type: web
    name: ultra-giveaway-bot
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: WEBHOOK_BASE_URL
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_POOL_SIZE
        value: "5"
      - key: DATABASE_MAX_OVERFLOW
        value: "0"
      - key: DATABASE_POOL_TIMEOUT
        value: "30"
